name: aitok

services:
  backend:
    image: aitok-backend:latest
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        BUILD_CPU_COUNT: ${BUILD_CPU_COUNT:-1}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      BACKEND_ADDR: :15681
      DATABASE_URL: ${DATABASE_URL:?请配置现有数据库的 DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?请配置固定的 JWT_SECRET}
      SESSION_ENCRYPTION_KEY: ${SESSION_ENCRYPTION_KEY:?请配置固定的 SESSION_ENCRYPTION_KEY}
      SUPER_ADMIN_USERNAME: ${SUPER_ADMIN_USERNAME:-admin}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:-123456}
      APP_BASE_URL: ${APP_BASE_URL:?请配置公开访问的 APP_BASE_URL}
      MAIL_PROVIDER: ${MAIL_PROVIDER:-cloudflare}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-no-reply@toktopup.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-AiTok}
      MAIL_APP_BASE_URL: ${MAIL_APP_BASE_URL:-}
      MAIL_CODE_EXPIRE_MINUTES: ${MAIL_CODE_EXPIRE_MINUTES:-10}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_EMAIL_API_TOKEN: ${CLOUDFLARE_EMAIL_API_TOKEN:-}
      CLOUDFLARE_EMAIL_API_BASE_URL: ${CLOUDFLARE_EMAIL_API_BASE_URL:-https://api.cloudflare.com/client/v4}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_1_PRICE_ID: ${STRIPE_1_PRICE_ID:-}
      STRIPE_100_PRICE_ID: ${STRIPE_100_PRICE_ID:-}
      TOKENS_PER_USD: ${TOKENS_PER_USD:-1}
      RENEWAL_TOKEN_COST: ${RENEWAL_TOKEN_COST:-20}
      RENEWAL_MONTHS: ${RENEWAL_MONTHS:-1}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${BACKEND_BIND_HOST:-127.0.0.1}:${BACKEND_PORT:-15681}:15681"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:15681/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: aitok-frontend:latest
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_BIND_HOST:-0.0.0.0}:${FRONTEND_PORT:-15680}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
