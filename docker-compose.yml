services:
  postgres:
    image: postgres:16-alpine
    container_name: getgpt-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: getgpt
    ports:
      - "15682:5432"
    volumes:
      - getgpt_pgdata:/var/lib/postgresql/data
volumes:
  getgpt_pgdata:
